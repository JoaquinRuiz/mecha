name: Release

# Pushing a tag vX.Y.Z builds the distributions once, tests them, publishes the same files
# to TestPyPI and then (after manual approval in the `pypi` environment) to PyPI, with
# Trusted Publishing (OIDC, no tokens) and attestations.
#
# Pending publishers to register (PyPI and TestPyPI):
#   owner JoaquinRuiz · repository mecha · workflow release.yml
#   environment testpypi (TestPyPI) · environment pypi (PyPI)

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build once (sdist + wheel)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # GitHub build provenance (Sigstore)
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3  # no moving major tag upstream
      - name: Tag matches the version in pyproject.toml
        run: uv run --no-project scripts/check_version.py "$GITHUB_REF_NAME"

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm -C web install --frozen-lockfile
      - name: Build frontend into src/mecha/static
        run: pnpm -C web build

      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv build
      - name: Wheel and sdist ship the frontend (and a wheel rebuilt from the sdist)
        run: uv run python scripts/check_dist.py dist --rebuild-from-sdist

      - name: Build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    name: clean install (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Only the smoke script: nothing from the source tree is installed.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/smoke_install.py
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@v10.3.3  # no moving major tag upstream
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # The wheel from this build, never an index (no --extra-index-url to TestPyPI).
      - name: uvx --from <wheel> mecha-keys
        shell: bash
        run: uv run --no-project scripts/smoke_install.py dist/mecha_keys-*-py3-none-any.whl

  testpypi:
    name: publish to TestPyPI
    needs: [build, smoke]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/mecha-keys/
    permissions:
      id-token: write          # Trusted Publishing + PyPI attestations
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: publish to PyPI (manual approval)
    needs: testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi              # protected: requires the maintainer's approval
      url: https://pypi.org/project/mecha-keys/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  github-release:
    name: GitHub release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Create the release with the same files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
