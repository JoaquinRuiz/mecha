name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # Frontend
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web lint
      - run: pnpm -C web test
      - name: Build frontend into src/mecha/static
        run: pnpm -C web build
      - name: Bundle size budget
        run: pnpm -C web size

      # Backend
      - uses: astral-sh/setup-uv@v10.3.3  # no moving major tag upstream
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: README capability table matches capabilities.toml
        run: uv run python scripts/gen_capabilities.py --check
      - run: uv run pytest

      # Package
      - run: uv build
      - name: Wheel and sdist ship the frontend (and a wheel rebuilt from the sdist)
        run: uv run python scripts/check_dist.py dist --rebuild-from-sdist
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  python:
    name: test (Python ${{ matrix.python }}, Linux)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # no moving major tag upstream
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest

  smoke:
    name: clean install (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/smoke_install.py
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@v10.3.3  # no moving major tag upstream
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: uvx --from <wheel> mecha-keys
        shell: bash
        run: uv run --no-project scripts/smoke_install.py dist/mecha_keys-*-py3-none-any.whl

  e2e:
    name: e2e (demo mode, Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v10.3.3  # no moving major tag upstream
        with:
          enable-cache: true
      - run: pnpm -C web install --frozen-lockfile
      # The e2e run must use a build that succeeded: never a stale one.
      - run: pnpm -C web build
      - run: uv sync --locked
      - run: pnpm -C web exec playwright install --with-deps chromium
      - name: Playwright against mecha serve --demo
        run: pnpm -C web e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7
